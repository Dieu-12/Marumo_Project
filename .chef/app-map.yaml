version: 1

features:
  home:
    title: Trang chủ
    auth: public
    code:
      - marumo_web/src/pages/HomePage.jsx
      - marumo_web/src/components/HeroCarousel.jsx
      - marumo_web/src/components/QuickTicketBar.jsx
      - marumo_web/src/components/MovieCard.jsx
      - marumo_web/src/components/Header.jsx
      - marumo_web/src/components/SearchModal.jsx
    entry_url: /
    selectors:
      - testid:home-page
      - testid:hero-carousel
      - testid:quick-ticket-form
      - testid:quick-ticket-submit
      - testid:movie-card
      - testid:header-search-open
      - testid:search-modal
      - testid:global-search-input
    smoke:
      - { action: goto, url: /, timeout_ms: 30000 }
      - { action: expectSelector, by: testid:home-page }
      - { action: screenshot, name: home-smoke }
    taste:
      - { action: goto, url: /, timeout_ms: 30000 }
      - { action: expectSelector, by: testid:home-page }
      - { action: expectSelector, by: testid:hero-carousel }
      - { action: expectSelector, by: testid:quick-ticket-form }
      - { action: expectSelector, by: testid:movie-card }
      - { action: click, by: testid:header-search-open }
      - { action: expectSelector, by: testid:search-modal }
      - { action: fill, by: testid:global-search-input, value: "Mặt Trời" }
      - { action: screenshot, name: home-search-modal }

  auth:
    title: Đăng nhập / Đăng ký
    auth: public
    code:
      - marumo_web/src/pages/AuthPage.jsx
      - marumo_web/src/context/AppContext.jsx
    entry_url: /dang-nhap
    selectors:
      - testid:auth-page
      - testid:auth-email
      - testid:auth-password
      - testid:auth-submit
      - testid:auth-switch-register
      - testid:auth-name
    smoke:
      - { action: goto, url: /dang-nhap, timeout_ms: 30000 }
      - { action: expectSelector, by: testid:auth-page }
      - { action: screenshot, name: auth-smoke }
    taste:
      - { action: goto, url: /dang-nhap, timeout_ms: 30000 }
      - { action: expectSelector, by: testid:auth-page }
      - { action: expectSelector, by: testid:auth-email }
      - { action: fill, by: testid:auth-email, value: "minh.anh@example.com" }
      - { action: fill, by: testid:auth-password, value: "demo1234", secret: true }
      - { action: expectSelector, by: testid:auth-submit }
      - { action: screenshot, name: auth-login }
      - { action: click, by: testid:auth-switch-register }
      - { action: expectSelector, by: testid:auth-name }
      - { action: screenshot, name: auth-register }

  cinemas:
    title: Hệ thống rạp
    auth: public
    code:
      - marumo_web/src/pages/CinemasPage.jsx
    entry_url: /cinemas
    selectors:
      - testid:cinemas-page
      - testid:cinemas-search
      - testid:cinemas-results-count
      - testid:cinema-info-card
    smoke:
      - { action: goto, url: /cinemas, timeout_ms: 30000 }
      - { action: expectSelector, by: testid:cinemas-page }
      - { action: screenshot, name: cinemas-smoke }
    taste:
      - { action: goto, url: /cinemas, timeout_ms: 30000 }
      - { action: expectSelector, by: testid:cinemas-page }
      - { action: expectSelector, by: testid:cinemas-results-count }
      - { action: expectSelector, by: testid:cinema-info-card }
      - { action: screenshot, name: cinemas-list }
