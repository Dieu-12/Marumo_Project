name: chef-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chef-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DISABLE_HMR: "true"

jobs:
  chef-gate:
    name: chef-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            .qoder/skills/chef-output/package-lock.json
            marumo_web/package-lock.json
            marumo_admin/package-lock.json
      - name: Install chef kit
        run: npm ci
        working-directory: .qoder/skills/chef-output
      - name: Install marumo_web
        run: npm ci
        working-directory: marumo_web
      - name: Install marumo_admin
        run: npm ci
        working-directory: marumo_admin
      - name: Verify Chrome
        run: google-chrome --version
      - name: Chef map-check
        run: node .qoder/skills/chef-output/bin/chef.mjs map-check
      - name: Chef taste (E2E thật)
        timeout-minutes: 10
        run: node .qoder/skills/chef-output/bin/chef.mjs taste --all --level=full
      - name: Chef guard --full
        timeout-minutes: 10
        run: node .qoder/skills/chef-output/bin/chef.mjs guard --full
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chef-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .chef/evidence
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
