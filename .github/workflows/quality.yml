name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HANDOFF_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix marumo_web
      - run: npm ci --prefix marumo_admin
      - run: npx playwright install --with-deps chromium
      - id: scope
        run: node scripts/handoff/cli.mjs scope
      - if: steps.scope.outputs.db == 'true'
        run: node scripts/handoff/ci-sql.mjs start
      - run: npm run handoff:ci
      - if: always() && steps.scope.outputs.db == 'true'
        run: node scripts/handoff/ci-sql.mjs stop
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handoff-evidence
          path: |
            handoff/report.json
            .quality/receipt.json
            .quality/logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
